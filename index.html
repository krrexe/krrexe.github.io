<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage of Krr</title>
  <style>
body {margin:8px; background:#c7c7c7 url("assets/background.png") repeat; color:#000; font-family:"Times New Roman",Times,serif;}
.logo {position:absolute;top:8px;right:8px;width:216px;height:300px;}
h1 {margin:8px 230px 22px 8px;text-align:left;font-size:60px;line-height:1.1;font-weight:bold;}
nav {display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:24px 0;}
nav a {display:inline-block;padding:5px 13px;background:#c0c0c0;border:2px solid;border-color:#fff #777 #777 #fff;color:#000;text-decoration:none;font:16px Arial,sans-serif;}
nav a:active {border-color:#777 #fff #fff #777;}
main {margin-left:8px;max-width:750px;}
h2 {font-size:30px;margin:0 0 14px;}
p {font-size:18px;}
#bouncy-logo {position:fixed;left:0;top:0;width:160px;max-width:32vw;height:auto;z-index:5;pointer-events:none;user-select:none;visibility:hidden;will-change:transform;}
@media(max-width:650px){.logo{width:108px;height:auto;} h1{font-size:38px;margin-right:115px;} nav{margin-top:24px;} nav a{font-size:14px;}}

  </style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="Krr logo">
  <h1>Homepage of Krr</h1>
  <nav aria-label="Navigation">
    <a href="index.html">Home</a>
    <a href="AboutMe/index.html">About Me</a>
    <a href="Projects/index.html">Projects</a>
    <a href="Blog/index.html">Blog</a>
    <a href="Links/index.html">Links</a>
  </nav>
  <img id="bouncy-logo" src="assets/bouncy.png" alt="" aria-hidden="true" draggable="false">
  <script>
  (() => {
    const image = document.getElementById('bouncy-logo');
    let x = 30, y = 170;
    let vx = 135, vy = 105; // pixels per second
    let last = 0;
    let running = false;

    function bounds() {
      return {
        x: Math.max(0, window.innerWidth - image.offsetWidth),
        y: Math.max(0, window.innerHeight - image.offsetHeight)
      };
    }
    function draw() {
      image.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }
    function tick(time) {
      if (!running) return;
      const delta = last ? Math.min((time - last) / 1000, 0.05) : 0;
      last = time;
      const max = bounds();
      x += vx * delta;
      y += vy * delta;
      if (x <= 0) { x = 0; vx = Math.abs(vx); }
      else if (x >= max.x) { x = max.x; vx = -Math.abs(vx); }
      if (y <= 0) { y = 0; vy = Math.abs(vy); }
      else if (y >= max.y) { y = max.y; vy = -Math.abs(vy); }
      draw();
      requestAnimationFrame(tick);
    }
    image.addEventListener('load', () => {
      const max = bounds();
      x = Math.min(x, max.x);
      y = Math.min(y, max.y);
      draw();
      image.style.visibility = 'visible';
      if (!running) { running = true; requestAnimationFrame(tick); }
    });
    window.addEventListener('resize', () => {
      const max = bounds();
      x = Math.min(Math.max(x, 0), max.x);
      y = Math.min(Math.max(y, 0), max.y);
      draw();
    });
  })();
  </script>
</body>
</html>
